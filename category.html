<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atma Nusantara - Tourism Categories</title>
  <link rel="stylesheet" href="style_category.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-wrapper">
    <!-- Navbar -->
    <header class="navbar">
      <div class="logo-container">
        <img src="./assets/icon/logo.png" alt="Atma Nusantara Logo" class="logo-img">
        <span class="brand-name">Atma Nusantara</span>
      </div>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#" class="active">Tourism Categories</a>
        <a href="#">Showcase</a>
        <a href="#">Gallery &amp; Journal</a>
      </nav>

      <a href="#" class="btn-contact">Contact &amp; Partnerships</a>
    </header>

    <!-- Hero / Category Filter Section -->
    <section class="category-banner">
      <img src="./assets/corak/corak_2.png" alt="Corak Banner" class="banner-ornament">

      <div class="banner-content">
        <h1>Select Tourism Category</h1>
        <p>Select a category below to filter the catalog of tourist destinations you wish to visit.</p>

        <div class="filter-buttons" id="filterContainer">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="Mountains & Nature">Mountains &amp; Nature</button>
          <button class="filter-btn" data-category="Culture & History">Culture &amp; History</button>
          <button class="filter-btn" data-category="Beaches & Marine Areas">Beaches &amp; Marine Areas</button>
        </div>
      </div>
    </section>

    <hr class="section-divider">

    <!-- Destination Cards Grid -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Kartu akan di-render melalui script.js -->
    </main>

    <!-- Garis pembatas tipis di atas footer -->
    <hr class="pre-footer-divider">

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-upper">
        <div class="footer-brand">
          <img src="./assets/icon/logo.png" alt="Atma Nusantara Logo" class="footer-logo">
          <span class="footer-brand-name">Atma Nusantara</span>
        </div>

        <div class="footer-BrandArt">
          <img src="./assets/image/name-brand(footer).png" alt="Atma Nusantara Typography" class="footer-art-img">
        </div>
      </div>

      <hr class="footer-inner-divider">

      <div class="footer-lower">
        <div class="footer-socials">
          <!-- Facebook -->
          <a href="#" aria-label="Facebook">
            <img src="./assets/icon/facebook.png" alt="fb" class="fb-icon">
          </a>
          <!-- TikTok -->
          <a href="#" aria-label="TikTok">
            <img src="./assets/icon/tiktok.png" alt="tiktok" class="tiktok-icon">
          </a>
          <!-- YouTube -->
          <a href="#" aria-label="YouTube">
            <img src="./assets/icon/youtube.png" alt="youtube" class="youtube-icon">
          </a>
          <!-- Instagram -->
          <a href="#" aria-label="Instagram">
            <img src="./assets/icon/Instagram.png" alt="instagram" class="instagram-icon">
          </a>
        </div>

        <p class="footer-copyright">&copy; Atma Nusantara. All Rights Reserved.</p>

        <div class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
