<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourism Categories - Atma Nusantara</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/category.css">
  <link rel="icon" type="image/png" href="assets/icon/logo.png">
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-logo">
          <img src="assets/icon/logo.png" alt="logo-icon" width="70px" height="70px">
        </div>
        <span class="brand-name">Atma Nusantara</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="category.html" class="active">Tourism Categories</a>
        <a href="top-destination.html">Top Destination</a>
        <a href="gallery-journal.html">Gallery &amp; Journal</a>
      </nav>

      <div class="nav-cta">
        <a href="contact-partnership.html" class="btn-nav btn-dark">Contact &amp; Partnerships</a>
      </div>
    </div>
  </header>

  <div class="container main-wrapper">
    <!-- Hero / Category Filter Section -->
    <section class="category-banner">
      <img src="assets/corak/corak_2.png" alt="Corak Banner" class="banner-ornament">

      <div class="banner-content">
        <h1>Select Tourism Category</h1>
        <p>Select a category below to filter the catalog of tourist destinations you wish to visit.</p>

        <div class="filter-buttons" id="filterContainer">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="Mountains & Nature">Mountains &amp; Nature</button>
          <button class="filter-btn" data-category="Culture & History">Culture &amp; History</button>
          <button class="filter-btn" data-category="Beaches & Marine Areas">Beaches &amp; Marine Areas</button>
        </div>
      </div>
    </section>

    <!-- Destination Cards Grid -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Kartu akan di-render melalui category.js -->
    </main>
  </div>

  <!-- Garis Pemisah Atas Footer -->
  <div class="container">
    <hr class="pre-footer-line" />
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <!-- Brand Kiri -->
        <a href="index.html" class="footer-brand">
          <div class="brand-emblem brand-emblem-footer">
            <div class="logo-circle-wrap">
              <img src="assets/icon/logo.png" alt="Atma Nusantara Logo" class="logo-img" width="60px" height="60px">
            </div>
          </div>
          <span class="brand-name-light">Atma Nusantara</span>
        </a>

        <!-- Image Watermark Kanan -->
        <div class="footer-watermark-wrap">
          <img src="assets/image/name-brand-footer.png" alt="Atma Nusantara Watermark" class="footer-watermark-img" width="650px" height="100px">
        </div>
      </div>

      <hr class="footer-divider" />

      <div class="footer-bottom">
        <div class="social-icons">
          <!-- Facebook -->
          <a href="https://facebook.com" aria-label="Facebook">
            <img src="assets/icon/facebook.png" alt="Facebook Icon" width="30px" height="30px">
          </a>
          <!-- TikTok -->
          <a href="https://tiktok.com" aria-label="TikTok">
            <img src="assets/icon/tiktok.png" alt="TikTok Icon" width="30px" height="30px">
          </a>
          <!-- YouTube -->
          <a href="https://youtube.com" aria-label="YouTube">
            <img src="assets/icon/youtube.png" alt="YouTube Icon" width="30px" height="30px">
          </a>
          <!-- Instagram -->
          <a href="https://instagram.com" aria-label="Instagram">
            <img src="assets/icon/instagram.png" alt="Instagram Icon" width="30px" height="30px">
          </a>
        </div>

        <p class="copyright">© Atma Nusantara. All Rights Reserved.</p>

        <div class="footer-legal">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/js/destinations-data.js"></script>
  <script src="assets/js/category.js"></script>
</body>
</html>
